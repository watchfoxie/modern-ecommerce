{{- if .Values.secrets.createPlaceholders }}
{{- $created := dict }}
{{- range $name, $workload := .Values.workloads }}
{{- if $workload.secretEnv }}
{{- $secretName := default $.Values.secrets.defaultSecretName $workload.secretName }}
{{- if not (hasKey $created $secretName) }}
{{- $_ := set $created $secretName true }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
{{ include "modern-ecommerce.labels" $ | indent 4 }}
type: Opaque
stringData:
{{- $secretKeys := dict }}
{{- range $otherName, $otherWorkload := $.Values.workloads }}
{{- if eq (default $.Values.secrets.defaultSecretName $otherWorkload.secretName) $secretName }}
{{- range $key := $otherWorkload.secretEnv }}
{{- if not (hasKey $secretKeys $key) }}
{{- $_ := set $secretKeys $key true }}
  {{ $key }}: replace-me
{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.rabbitmq.embedded.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modern-ecommerce.fullname" . }}-rabbitmq-secret
  labels:
{{ include "modern-ecommerce.labels" . | indent 4 }}
    app.kubernetes.io/component: rabbitmq
type: Opaque
stringData:
  RABBITMQ_USERNAME: replace-me
  RABBITMQ_PASSWORD: replace-me
{{- end }}
{{- end }}

spring:
  config:
    import: optional:file:.env.production[.properties],optional:file:../.env.production[.properties],optional:file:../../.env.production[.properties]
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${API_GATEWAY_CONNECT_TIMEOUT:5000}
            response-timeout: ${API_GATEWAY_RESPONSE_TIMEOUT:5s}
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - '*'
                allowCredentials: true
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth-service/**
              filters:
                - StripPrefix=2
                - RewriteResponseHeader=Location, ^/swagger-ui/index\.html$, /api/auth-service/swagger-ui/index.html
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/user-service/**
              filters:
                - StripPrefix=2
                - RewriteResponseHeader=Location, ^/swagger-ui/index\.html$, /api/user-service/swagger-ui/index.html
            - id: category-service
              uri: lb://CATEGORY-SERVICE
              predicates:
                - Path=/api/category-service/**
              filters:
                - StripPrefix=2
                - RewriteResponseHeader=Location, ^/swagger-ui/index\.html$, /api/category-service/swagger-ui/index.html
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/product-service/**
              filters:
                - StripPrefix=2
                - RewriteResponseHeader=Location, ^/swagger-ui/index\.html$, /api/product-service/swagger-ui/index.html
            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/cart-service/**
              filters:
                - StripPrefix=2
                - RewriteResponseHeader=Location, ^/swagger-ui/index\.html$, /api/cart-service/swagger-ui/index.html
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/order-service/**
              filters:
                - StripPrefix=2
                - RewriteResponseHeader=Location, ^/swagger-ui/index\.html$, /api/order-service/swagger-ui/index.html
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notification-service/**
              filters:
                - StripPrefix=2
                - RewriteResponseHeader=Location, ^/swagger-ui/index\.html$, /api/notification-service/swagger-ui/index.html
    inetutils:
      timeout-seconds: ${SPRING_CLOUD_INETUTILS_TIMEOUT_SECONDS:1}
      preferred-networks:
        - 192\.168\..*
        - 10\..*
        - 172\.(1[6-9]|2\d|3[0-1])\..*
      ignored-interfaces:
        - vEthernet.*
        - .*WSL.*
        - .*Hyper-V.*
        - VirtualBox.*
        - VMware.*
        - Loopback.*
        - docker.*
        - br-.*
        - Radmin.*
      use-only-site-local-interfaces: ${SPRING_CLOUD_INETUTILS_USE_ONLY_SITE_LOCAL_INTERFACES:true}

server:
  port: ${API_GATEWAY_PORT:8080}

app:
  security:
    jwt-signing-secret: ${JWT_SIGNING_SECRET}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}
    rate-limit-per-minute: ${API_GATEWAY_RATE_LIMIT_PER_MINUTE:300}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    metadata-map:
      version: ${APP_VERSION:0.0.1-SNAPSHOT}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}

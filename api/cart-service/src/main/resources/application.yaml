spring:
    lifecycle:
        timeout-per-shutdown-phase: ${CART_SERVICE_SHUTDOWN_TIMEOUT:${GRACEFUL_SHUTDOWN_TIMEOUT:30s}}
    profiles:
        default: local
    security:
        user:
            name: ${CART_SERVICE_USERNAME}
            password: ${CART_SERVICE_PASSWORD}

server:
    shutdown: graceful

management:
    endpoint:
        health:
            probes:
                enabled: true
    endpoints:
        web:
            exposure:
                include: health,info

app:
    data:
        migrations:
            enabled: ${APP_DATA_MIGRATIONS_ENABLED:true}
            fail-fast: ${APP_DATA_MIGRATIONS_FAIL_FAST:true}
        seed:
            enabled: ${APP_DATA_SEED_ENABLED:false}
    security:
        internal-service-token: ${INTERNAL_SERVICE_TOKEN}

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${ORDER_SERVICE_SHUTDOWN_TIMEOUT:${GRACEFUL_SHUTDOWN_TIMEOUT:30s}}
  profiles:
    default: local
  application:
    name: order-service
  cloud:
    inetutils:
      timeout-seconds: ${SPRING_CLOUD_INETUTILS_TIMEOUT_SECONDS:1}
      preferred-networks:
        - 192\.168\..*
        - 10\..*
        - 172\.(1[6-9]|2\d|3[0-1])\..*
      ignored-interfaces:
        - vEthernet.*
        - .*WSL.*
        - .*Hyper-V.*
        - VirtualBox.*
        - VMware.*
        - Loopback.*
        - docker.*
        - br-.*
        - Radmin.*
      use-only-site-local-interfaces: ${SPRING_CLOUD_INETUTILS_USE_ONLY_SITE_LOCAL_INTERFACES:true}
  data:
    mongodb:
      uri: ${ORDER_MONGODB_URI}
  mongodb:
    uri: ${ORDER_MONGODB_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  shutdown: graceful
  port: ${ORDER_SERVICE_PORT:8086}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}

app:
  data:
    migrations:
      enabled: ${APP_DATA_MIGRATIONS_ENABLED:true}
      fail-fast: ${APP_DATA_MIGRATIONS_FAIL_FAST:true}
    seed:
      enabled: ${APP_DATA_SEED_ENABLED:false}
  security:
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  messaging:
    exchange: ${ORDER_EVENTS_EXCHANGE:modern-ecommerce.events}
    dead-letter-exchange: ${ORDER_EVENTS_DLX:modern-ecommerce.events.dlx}
    order-created-routing-key: ${ORDER_CREATED_ROUTING_KEY:order.created}

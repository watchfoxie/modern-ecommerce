spring:
    lifecycle:
        timeout-per-shutdown-phase: ${CATEGORY_SERVICE_SHUTDOWN_TIMEOUT:${GRACEFUL_SHUTDOWN_TIMEOUT:30s}}
    profiles:
        default: local
    security:
        user:
            name: ${CATEGORY_SERVICE_USERNAME}
            password: ${CATEGORY_SERVICE_PASSWORD}

server:
    shutdown: graceful

management:
    endpoint:
        health:
            probes:
                enabled: true
    endpoints:
        web:
            exposure:
                include: health,info

app:
    data:
        migrations:
            enabled: ${APP_DATA_MIGRATIONS_ENABLED:true}
            fail-fast: ${APP_DATA_MIGRATIONS_FAIL_FAST:true}
        seed:
            enabled: ${APP_DATA_SEED_ENABLED:false}
            categories-path: ${CATEGORY_SAMPLE_DATA_PATH:../../static/sample-data/structured-data/category-service.categories.json}

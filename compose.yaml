          cpus: "0.25"
          memory: 256M
    networks:
      - modern-ecommerce-network

  web:
    image: modern-ecommerce-web:${IMAGE_TAG:-local}
    container_name: modern-ecommerce-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: .\web\Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      VITE_PORT: "${VITE_PORT:-4173}"
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
      VITE_API_PROXY_TARGET: "http://api-gateway:${API_GATEWAY_PORT:-8080}"
    ports:
      - "${VITE_PORT:-4173}:${VITE_PORT:-4173}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${VITE_PORT:-4173}/ >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
    networks:
      - modern-ecommerce-network

networks:
  modern-ecommerce-network:
    driver: bridge

volumes:
  modern-ecommerce-rabbitmq:
    name: modern-ecommerce-rabbitmq
    driver: local

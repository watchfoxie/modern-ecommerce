services:
  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    container_name: modern-ecommerce-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-guest}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - .\rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - modern-ecommerce-rabbitmq:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - modern-ecommerce-network

  service-registry:
    image: modern-ecommerce-service-registry:${IMAGE_TAG:-local}
    container_name: modern-ecommerce-service-registry
    restart: unless-stopped
    build:
      context: .\api\service-registry
      dockerfile: Dockerfile
    environment:
      SERVICE_REGISTRY_PORT: "${SERVICE_REGISTRY_PORT:-8761}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-local}"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:${SERVICE_REGISTRY_PORT:-8761}/eureka/"
      SPRING_CLOUD_INETUTILS_USE_ONLY_SITE_LOCAL_INTERFACES: "${SPRING_CLOUD_INETUTILS_USE_ONLY_SITE_LOCAL_INTERFACES:-true}"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-false}"
    ports:
      - "${SERVICE_REGISTRY_PORT:-8761}:${SERVICE_REGISTRY_PORT:-8761}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:${SERVICE_REGISTRY_PORT:-8761}/",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - modern-ecommerce-network

  auth-service:
    image: modern-ecommerce-auth-service:${IMAGE_TAG:-local}
    container_name: modern-ecommerce-auth-service
    restart: unless-stopped
    build:
      context: .\api\auth-service
      dockerfile: Dockerfile
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      AUTH_SERVICE_PORT: "${AUTH_SERVICE_PORT:-8081}"
      AUTH_MONGODB_URI: "${AUTH_MONGODB_URI:?AUTH_MONGODB_URI must be set}"
      AUTH_SERVICE_DB_NAME: "${AUTH_SERVICE_DB_NAME:?AUTH_SERVICE_DB_NAME must be set}"
      COMMON_COLLECTION_NAME: "${COMMON_COLLECTION_NAME:-init}"
      APP_DATA_MIGRATIONS_ENABLED: "${APP_DATA_MIGRATIONS_ENABLED:-true}"
      APP_DATA_MIGRATIONS_FAIL_FAST: "${APP_DATA_MIGRATIONS_FAIL_FAST:-true}"
      APP_DATA_SEED_ENABLED: "${APP_DATA_SEED_ENABLED:-false}"
      AUTH_SERVICE_USERNAME: "${AUTH_SERVICE_USERNAME:?AUTH_SERVICE_USERNAME must be set}"
      AUTH_SERVICE_PASSWORD: "${AUTH_SERVICE_PASSWORD:?AUTH_SERVICE_PASSWORD must be set}"
      JWT_SIGNING_SECRET: "${JWT_SIGNING_SECRET:-r6qeV6d8J9t3cDbFw1y8EydRHoY1h17CoOrpzl5rvB3}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-AYmtWAAxsNTXoHtWZYjyQ1k01u8huw9fIIo1VAkbA3t}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-local}"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:${SERVICE_REGISTRY_PORT:-8761}/eureka/"
      SPRING_CLOUD_INETUTILS_USE_ONLY_SITE_LOCAL_INTERFACES: "${SPRING_CLOUD_INETUTILS_USE_ONLY_SITE_LOCAL_INTERFACES:-true}"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-false}"
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:${AUTH_SERVICE_PORT:-8081}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:${AUTH_SERVICE_PORT:-8081}/actuator/health/readiness | grep -q ''"status":"UP"''',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:

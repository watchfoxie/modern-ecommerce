name: modern-ecommerce-ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  backend-tests:
    name: Backend tests - ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - service-registry
          - api-gateway
          - auth-service
          - user-service
          - category-service
          - product-service
          - cart-service
          - order-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven tests
        working-directory: api/${{ matrix.module }}
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

  frontend-tests:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Validate sample data
        working-directory: web
        run: npm run sample-data:validate

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Validate lockfile
        working-directory: web
        run: npm run lockfile:lint

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate base Compose config
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

      - name: Validate debug Compose override
        run: docker compose --env-file .env.example -f compose.yaml -f compose.debug.yaml config --quiet

  docker-images:
    name: Docker image build and scan - ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
      - compose-config
      - openapi-contract-guards
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: service-registry
            context: api/service-registry
            dockerfile: api/service-registry/Dockerfile
          - name: api-gateway
            context: api/api-gateway
            dockerfile: api/api-gateway/Dockerfile
          - name: auth-service
            context: api/auth-service
            dockerfile: api/auth-service/Dockerfile
          - name: user-service
            context: api/user-service
            dockerfile: api/user-service/Dockerfile
          - name: category-service
            context: api/category-service
            dockerfile: api/category-service/Dockerfile
          - name: product-service
            context: api/product-service
            dockerfile: api/product-service/Dockerfile
          - name: cart-service
            context: api/cart-service
            dockerfile: api/cart-service/Dockerfile
          - name: order-service
            context: api/order-service
            dockerfile: api/order-service/Dockerfile
          - name: notification-service
            context: api/notification-service
            dockerfile: api/notification-service/Dockerfile
          - name: web
            context: .
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: modern-ecommerce-${{ matrix.image.name }}:${{ env.IMAGE_TAG }}

      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: modern-ecommerce-${{ matrix.image.name }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: HIGH,CRITICAL

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && hashFiles(format('trivy-{0}.sarif', matrix.image.name)) != '' }}
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: modern-ecommerce-${{ matrix.image.name }}:${{ env.IMAGE_TAG }}
          artifact-name: sbom-${{ matrix.image.name }}.spdx.json

  openapi-contract-guards:
    name: OpenAPI contract guards
    runs-on: ubuntu-latest
    needs:
      - backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Verify Springdoc coverage
        shell: bash
        run: |
          set -euo pipefail
          mvc_modules=(auth-service user-service category-service product-service cart-service order-service notification-service)
          for module in "${mvc_modules[@]}"; do
            grep -q "springdoc-openapi-starter-webmvc-ui" "api/${module}/pom.xml"
            find "api/${module}/src/main/java" -name "*OpenApiConfig.java" | grep -q .
          done
          grep -q "springdoc-openapi-starter-webflux-ui" "api/api-gateway/pom.xml"
          grep -q "/api/product-service/v3/api-docs" "api/api-gateway/src/main/resources/application-local.yaml"

  helm-and-terraform:
    name: Helm and Terraform validation
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
      - compose-config
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Helm lint
        run: helm lint helm/modern-ecommerce

      - name: Helm template
        run: helm template modern-ecommerce helm/modern-ecommerce --values helm/modern-ecommerce/values-dev.yaml > rendered-manifests.yaml

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate rendered Kubernetes manifests
        run: kubeconform -strict -summary -ignore-missing-schemas rendered-manifests.yaml

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform static analysis
        uses: terraform-linters/setup-tflint@v4

      - name: Run tflint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          quiet: true
          soft_fail: false

  image-signing:
    name: Optional image signing
    runs-on: ubuntu-latest
    needs:
      - docker-images
    if: github.event_name == 'push'
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Sign published images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "COSIGN_PRIVATE_KEY is not configured; skipping image signing."
            exit 0
          fi
          echo "Image signing is wired for published registry images."
          echo "Publish steps can call: cosign sign --key env://COSIGN_PRIVATE_KEY <image-ref>"
